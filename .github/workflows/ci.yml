# Prüfungen bei jedem Push und Pull Request (GitHub Actions).
# Gleiche Befehle wie lokal vor einem Release – siehe README, „Entwicklung“.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Von Hand (Actions → CI → Run workflow): Releases für alle Tags anlegen/aktualisieren
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = Mindestversion, 3.13 = Debian 13 (Zielsystem)
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy src
      - name: shellcheck
        run: shellcheck deploy/*.sh
      - name: pytest (inkl. Migrationen auf befüllter Datenbank)
        run: pytest -q

  # Tag vX.Y.Z → GitHub-Release mit dem Abschnitt aus CHANGELOG.md (nur wenn alles grün);
  # von Hand gestartet → Releases für alle Tags
  release:
    needs: pruefen
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout legt den Tag ohne Annotation an; der Betreff ist der Release-Titel
      - name: Tags mit Annotation
        run: git fetch --force --tags origin
      - name: Release anlegen
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            python3 scripts/github_release.py --all
          else
            python3 scripts/github_release.py "${GITHUB_REF_NAME}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
